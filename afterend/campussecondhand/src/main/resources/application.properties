spring.application.name=campus-secondhand
# IDs and status codes must never silently truncate JSON decimal numbers.
spring.jackson.deserialization.accept-float-as-int=false
# ?????
spring.datasource.url=jdbc:mysql://localhost:3306/campus_secondhand?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus??
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# JWT??
jwt.secret=${JWT_SECRET}
jwt.expiration=86400

# ????
server.port=8080
# 增加请求体大小限制，支持Base64图片上传（最大50MB）
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# Tomcat配置，处理大请求体（防止上传大图片时请求过大）
server.tomcat.max-swallow-size=50MB
server.tomcat.max-http-post-size=50MB

# 日志配置
logging.level.com.campus.secondhand=INFO

# 自动执行 SQL 脚本
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:schema.sql



spring.config.import=optional:file:./.local/runtime.properties
